name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-docker:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build
      run: dotnet build

    - name: Test
      run: dotnet test

    - name: Docker Build
      run: docker build -t devops-demo:v1 .